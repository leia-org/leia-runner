type: object
properties:
  message:
    type: string
    example: Hello, can you help me start?
  opening:
    type: boolean
    description: Mark an internal startup request so supported providers keep startup instructions out of participant history. Cannot be combined with toolResults.
  context:
    type: string
    maxLength: 4000
    description: Hidden context for this turn, sent to the model as a separate developer item right before the participant message (never as participant text). Ignored with opening or toolResults. Providers that used it answer with contextApplied true; the others ignore it.
    example: '[Automatic context from the code editor. Not written by the student.] ...'
  tools:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
          example: get_current_problem
        description:
          type: string
          example: Returns the current problem spec.
        parameters:
          type: object
          additionalProperties: true
      required:
        - name
        - parameters
  toolResults:
    type: array
    items:
      type: object
      properties:
        callId:
          type: string
          example: call_abc123
        output:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items: {}
            - type: object
              additionalProperties: true
      required:
        - callId
        - output
description: Send either a message or toolResults.

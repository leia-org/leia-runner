type: object
properties:
  sessionId:
    type: string
    example: session-123
  leia:
    type: object
    properties:
      apiVersion:
        type: string
        example: v1
      metadata:
        type: object
        properties:
          name:
            type: string
            example: sample-activity
          version:
            type: string
            example: 1.0.0
        required:
          - name
          - version
      spec:
        type: object
        properties:
          problem:
            type: object
            properties:
              spec:
                type: object
                properties:
                  description:
                    type: string
                  personaBackground:
                    type: string
                  details:
                    type: string
                  solution:
                    type: string
                  solutionFormat:
                    type: string
                    example: text
                  evaluationPrompt:
                    type: string
                  process:
                    type: string
                  extends:
                    type: object
                    additionalProperties: true
                  overrides:
                    type: object
                    additionalProperties: true
                  constrainedTo:
                    type: object
                    additionalProperties: true
                required:
                  - description
                  - personaBackground
                  - details
                  - solution
            required:
              - spec
          behaviour:
            type: object
            properties:
              spec:
                type: object
                properties:
                  description:
                    type: string
                  role:
                    type: string
                  tooltip:
                    type: string
                  conversationDynamics:
                    type: object
                    properties:
                      stoppingCondition:
                        type: object
                        properties:
                          enabled:
                            type: boolean
                          prompt:
                            type: string
                            description: Required when enabled is true.
                      speaksFirst:
                        type: object
                        properties:
                          enabled:
                            type: boolean
                          prompt:
                            type: string
                            description: Optional guidance for the first LEIA message.
                  process:
                    type: array
                    items:
                      type: string
                required:
                  - description
                  - role
                  - tooltip
            required:
              - spec
        required:
          - problem
          - behaviour
    required:
      - apiVersion
      - metadata
      - spec
    description: LEIA configuration object.
  runnerConfiguration:
    $ref: '../common/runnerConfiguration.yaml'
  reflectiveContext:
    type: object
    description: Runtime context when the behaviour references the previous conversation; alternatively embedded in leia.spec.reflectiveContext by Workbench.
    required: [previousConversation, previousSolution]
    properties:
      previousConversation:
        type: array
        items:
          type: object
          properties:
            role:
              type: string
              enum: [user, assistant]
            content:
              type: string
      previousSolution:
        type: string
required:
  - sessionId
  - leia

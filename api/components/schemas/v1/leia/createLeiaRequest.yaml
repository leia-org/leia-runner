type: object
properties:
  sessionId:
    type: string
    example: session-123
  leia:
    type: object
    properties:
      apiVersion:
        type: string
        example: v1
      metadata:
        type: object
        properties:
          name:
            type: string
            example: sample-activity
          version:
            type: string
            example: 1.0.0
        required:
          - name
          - version
      spec:
        type: object
        properties:
          problem:
            type: object
            properties:
              spec:
                type: object
                properties:
                  description:
                    type: string
                  personaBackground:
                    type: string
                  details:
                    type: string
                  solution:
                    type: string
                  solutionFormat:
                    type: string
                    example: text
                  evaluationPrompt:
                    type: string
                  process:
                    type: string
                  extends:
                    type: object
                    additionalProperties: true
                  overrides:
                    type: object
                    additionalProperties: true
                  constrainedTo:
                    type: object
                    additionalProperties: true
                required:
                  - description
                  - personaBackground
                  - details
                  - solution
            required:
              - spec
          behaviour:
            type: object
            properties:
              spec:
                type: object
                properties:
                  description:
                    type: string
                  role:
                    type: string
                  tooltip:
                    type: string
                  reflective:
                    type: boolean
                    default: false
                  evaluationPrompt:
                    type: string
                    description: Required and non-empty for Reflective LEIA.
                  stoppingPrompt:
                    type: string
                    description: Required and non-empty for Reflective LEIA. The model concludes the interview according to this instruction.
                  process:
                    type: array
                    items:
                      type: string
                required:
                  - description
                  - role
                  - tooltip
            required:
              - spec
        required:
          - problem
          - behaviour
    required:
      - apiVersion
      - metadata
      - spec
    description: LEIA configuration object.
  runnerConfiguration:
    $ref: '../common/runnerConfiguration.yaml'
  reflectiveContext:
    type: object
    description: Runtime-only context, required for Reflective LEIA; alternatively embedded in leia.spec.reflectiveContext by Workbench.
    required: [previousConversation, previousSolution]
    properties:
      previousConversation:
        type: array
        items:
          type: object
          properties:
            role:
              type: string
              enum: [user, assistant]
            content:
              type: string
      previousSolution:
        type: string
required:
  - sessionId
  - leia

type: object
properties:
  maxInternalTurns:
    type: integer
    minimum: 2
    maximum: 5
    default: 2
  openingActorId:
    type: string
    nullable: true
    description: Actor that opens the first deterministic traversal.
  problemActorId:
    type: string
    nullable: true
    description: Actor whose problem supplies the shared scenario and evaluation.
  sharedTask:
    type: string
    description: Optional shared task. When empty, it is derived from the shared problem.

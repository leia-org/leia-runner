type: object
required:
  - sessionId
  - status
  - actors
  - graph
  - maxInternalTurns
  - openingActorId
  - problemActorId
  - lastSequence
properties:
  sessionId:
    type: string
  status:
    type: string
    enum: [running, awaiting_user]
  actors:
    type: array
    items:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
  graph:
    type: object
    additionalProperties: true
  maxInternalTurns:
    type: integer
  openingActorId:
    type: string
  problemActorId:
    type: string
  nextActorId:
    type: string
    nullable: true
  lastSequence:
    type: integer
